<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="1024x1024" href="assets/icon.png">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <meta name="theme-color" content="#eef4fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="계좌 화면 데모">
  <title>계좌 화면 데모</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #eef4fa; }
    body { display: flex; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { width: min(100%, 480px); position: relative; background: white; }
    .screen { display: none; position: relative; width: 100%; }
    .screen.active { display: block; }
    .screen img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .hotspot { position: absolute; display: block; border: 0; padding: 0; background: transparent; cursor: pointer; touch-action: manipulation; }
    .hotspot:focus-visible { outline: 3px solid #365ee8; outline-offset: -3px; border-radius: 8px; }
    #balance { left: 15%; top: 26%; width: 43%; height: 6%; }
    #transfer-open { left: 16%; top: 32.4%; width: 33%; height: 5.4%; }
    #back-home { left: 3%; top: 1%; width: 9%; height: 6%; }
    #transfer-back { left: 3%; top: 7%; width: 25%; height: 6%; }
    #transfer-home { left: 75%; top: 7%; width: 11%; height: 6%; }
    .transactions-art { position: relative; width: 100%; aspect-ratio: 1001 / 1538; overflow: hidden; }
    .transactions-art img { position: absolute; inset: 0; }
    .list-header { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100%, 480px); z-index: 2; display: none; align-items: center; justify-content: space-between; height: 62px; padding: 0 6%; background: #fff; border-bottom: 1px solid #e6e9eb; font-size: 18px; color: #292b2e; }
    .list-header.visible { display: flex; }
    .list-header button { border: 0; background: none; padding: 8px 5px; font: inherit; color: inherit; }
    .list-header .icons { font-size: 24px; letter-spacing: 8px; white-space: nowrap; }
    .entries { padding: 0 6%; background: #fff; }
    .month-heading { margin: 0; padding: 22px 0 14px; border-top: 2px solid #6c737a; border-bottom: 1px solid #e6e9eb; font-size: 20px; color: #292b2e; }
    .entry { min-height: 170px; padding: 25px 0 21px; border-bottom: 1px solid #e6e9eb; color: #292b2e; }
    .entry-meta { color: #747a82; font-size: 15px; white-space: nowrap; }
    .entry-meta .divider { color: #d7dce0; padding: 0 5px; }
    .entry-name { display: block; margin-top: 17px; font-size: 19px; font-weight: 600; }
    .entry-amount { display: block; margin-top: 14px; text-align: right; font-size: 19px; font-weight: 600; }
    .entry-amount.deposit { color: #287ff3; }
    .entry-balance { display: block; margin-top: 4px; text-align: right; color: #777e87; font-size: 16px; }
    .reconstruction-note { margin: 0; padding: 12px 6%; background: #fff8dd; color: #625219; font-size: 12px; }
    .screen[hidden] { display: none !important; }
    @media (min-width: 481px) { main { box-shadow: 0 0 30px #0002; } }
  </style>
</head>
<body>
  <main aria-label="은행 화면 모형">
    <section class="screen active" id="home-screen" aria-label="첫 화면">
      <img src="assets/home.png" alt="계좌 카드와 잔액 211,000원" draggable="false">
      <button class="hotspot" id="balance" type="button" aria-label="잔액 211,000원, 거래내역 보기"></button>
      <button class="hotspot" id="transfer-open" type="button" aria-label="이체 화면 보기"></button>
    </section>
    <section class="screen" id="transactions-screen" aria-label="거래내역 화면" hidden>
      <div class="transactions-art">
        <img src="assets/transactions.png" alt="거래내역조회 계좌와 잔액, 조회 설정" draggable="false">
        <button class="hotspot" id="back-home" type="button" aria-label="첫 화면으로 돌아가기"></button>
      </div>
      <div class="list-header"><button id="list-back" type="button" aria-label="첫 화면으로">〈</button><span>거래내역조회</span><span class="icons" aria-hidden="true">⌂ ☰</span></div>
      <p class="reconstruction-note">편집된 개인 기록 · 원본 증빙 아님</p>
      <div class="entries" id="entries" aria-label="거래 내역 목록"></div>
    </section>
    <section class="screen" id="transfer-screen" aria-label="이체 화면" hidden>
      <img src="assets/transfer.png" alt="이체 화면과 최근 계좌 목록" draggable="false">
      <button class="hotspot" id="transfer-back" type="button" aria-label="메인 화면으로 돌아가기"></button>
      <button class="hotspot" id="transfer-home" type="button" aria-label="홈으로 돌아가기"></button>
    </section>
  </main>
  <script>
    const screens = {
      home: document.getElementById('home-screen'),
      transactions: document.getElementById('transactions-screen'),
      transfer: document.getElementById('transfer-screen')
    };
    function showScreen(name, updateHistory = true) {
      for (const [key, screen] of Object.entries(screens)) {
        const active = key === name;
        screen.hidden = !active;
        screen.classList.toggle('active', active);
      }
      if (updateHistory) history.pushState({ screen: name }, '', '#' + name);
      window.scrollTo(0, 0);
      requestAnimationFrame(updateStickyHeader);
    }
    document.getElementById('balance').onclick = () => showScreen('transactions');
    document.getElementById('transfer-open').onclick = () => showScreen('transfer');
    document.getElementById('transfer-back').onclick = () => showScreen('home');
    document.getElementById('transfer-home').onclick = () => showScreen('home');
    document.getElementById('list-back').onclick = () => showScreen('home');
    function updateStickyHeader() {
      const screen = screens.transactions;
      const pastTop = screen.getBoundingClientRect().top < -screen.querySelector('.transactions-art').clientHeight + 62;
      screen.querySelector('.list-header').classList.toggle('visible', !screen.hidden && pastTop);
    }
    window.addEventListener('scroll', updateStickyHeader, { passive: true });
    document.getElementById('back-home').onclick = () => showScreen('home');
    window.addEventListener('popstate', () => showScreen(
      Object.hasOwn(screens, location.hash.slice(1)) ? location.hash.slice(1) : 'home', false
    ));
